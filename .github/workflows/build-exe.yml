name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    

    - name: Inject license secret
      shell: pwsh
      run: |
        $secret = "${{ secrets.LICENSE_SECRET }}"
        if (-not $secret) { $secret = "dev-secret-cambiar-en-produccion" }
        Set-Content -Path "core\licencia_secret.py" -Value "LICENSE_SECRET = `"$secret`""

    - name: Build executable with PyInstaller
      run: pyinstaller facturacion.spec --clean --noconfirm
    
    - name: Install Inno Setup
      run: choco install innosetup --no-progress
    
    - name: Compile installer with Inno Setup
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" instalador\facturacion.iss
      shell: pwsh
    
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: Facturacion-Installer
        path: instalador/Facturacion-Setup-*.exe
    
    - name: Create release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: instalador/Facturacion-Setup-*.exe
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
