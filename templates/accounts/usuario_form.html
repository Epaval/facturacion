{% extends "base.html" %}
{% block content %}
<div class="panel" style="max-width:640px">
  <h1>{{ title }}</h1>
  <form method="post" data-guardar>
    {% csrf_token %}
    {% if creando %}
      <p><label>Usuario *</label>{{ form.username }}</p>
    {% else %}
      <p class="subtitulo">Usuario: <strong>{{ object.username }}</strong></p>
    {% endif %}
    <div class="form-fila">
      <p><label>Nombres</label>{{ form.nombres }}</p>
      <p><label>Apellidos</label>{{ form.apellidos }}</p>
    </div>
    <div class="form-fila">
      <p><label>Rol</label>{{ form.rol }}</p>
      <p><label>Activo</label>{{ form.is_active }}</p>
    </div>
    <p><label>{% if creando %}Contraseña *{% else %}Nueva contraseña (opcional){% endif %}</label>
      <input type="password" name="password_nueva" {% if creando %}required{% endif %} minlength="6"
             placeholder="{% if creando %}Mínimo 6 caracteres{% else %}Dejar vacío para no cambiar{% endif %}">
    </p>
    <button class="btn btn-verde" type="submit">Guardar (F8)</button>
    <a class="btn btn-borde" href="{% url 'accounts:usuarios' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
